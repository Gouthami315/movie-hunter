<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Hunter</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        nav {
            background: #333;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
        }

        .container {
            padding: 30px;
        }

        .search-box {
            text-align: center;
            margin-bottom: 30px;
        }

        .search-box input {
            width: 60%;
            padding: 12px;
            font-size: 16px;
        }

        #movies {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .movie-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            cursor: pointer;
        }

        .movie-card:hover {
            transform: translateY(-5px);
        }

        .movie-poster {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
            background: #ddd;
        }

        .movie-card h3 {
            margin-bottom: 5px;
        }

        .rating {
            font-weight: bold;
        }

        .review {
            background: #f1f1f1;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }

        .review button {
            margin-right: 8px;
            margin-top: 5px;
        }

        textarea {
            width: 90%;
            height: 100px;
            padding: 10px;
            font-size: 15px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #333;
            color: white;
        }

        button:hover {
            background: #555;
        }

        input {
            padding: 10px;
            font-size: 15px;
        }

    </style>

</head>


<body>

    <header>
        <h1>🎬 Movie Hunter</h1>
    </header>


    <nav>
        <a href="#">In Theaters</a>
        <a href="#">Movies</a>
        <a href="#">Reviews</a>
    </nav>


    <div class="container">

        <h2>Movie Page</h2>
        <p><b>Roll No:</b> 25251A0504</p>



        <div class="search-box">

            <input
                type="text"
                id="search"
                placeholder="Search movies..."
            >

        </div>


        <div id="movies"></div>

    </div>


    <script>

        let allMovies = [];


        // Movie poster locations
        const posterMap = {

            "12th Fail": "/posters/12thfail.jpg",

            "Sita Ramam": "/posters/sitaramam.jpg",

            "Dashavatharam": "/posters/dashavatharam.jpg",

            "Taare Zameen Par": "/posters/tare.jpg"

        };


        // Load movies from MongoDB
        async function loadMovies() {

            const response = await fetch("/movies");

            allMovies = await response.json();

            displayMovies(allMovies);

        }


        // Display all movie cards
        function displayMovies(movies) {

            const container =
                document.getElementById("movies");

            container.innerHTML = "";


            movies.forEach(movie => {

                const card =
                    document.createElement("div");

                card.className = "movie-card";


                card.innerHTML = `

                    <img
                        class="movie-poster"
                        src="${posterMap[movie.title] || 'https://via.placeholder.com/220x300?text=Movie'}"
                        alt="${movie.title}"
                    >

                    <h3>${movie.title}</h3>

                    <p>${movie.genre || ""}</p>

                    <p class="rating">
                        ⭐ ${movie.rating || "N/A"}
                    </p>

                `;


                card.addEventListener("click", () => {

                    showMovieDetails(movie);

                });


                container.appendChild(card);

            });

        }


        // Show movie details and user reviews
        async function showMovieDetails(movie) {

            const container =
                document.getElementById("movies");


            // Get reviews from MongoDB
            const response =
                await fetch(`/reviews/${movie._id}`);


            const reviews =
                await response.json();


            let reviewsHTML = "";


            // Display every review
            reviews.forEach(review => {

                reviewsHTML += `

                    <div class="review">

                        <h3>
                            ${review.name}
                        </h3>

                        <p>
                            ⭐ ${review.rating}/5
                        </p>

                        <p>
                            ${review.comment}
                        </p>

                        <button
                            onclick="editReview('${review._id}', '${movie._id}')"
                        >
                            ✏️ Edit
                        </button>

                        <button
                            onclick="deleteReview('${review._id}', '${movie._id}')"
                        >
                            🗑️ Delete
                        </button>

                    </div>

                `;

            });


            if (reviews.length === 0) {

                reviewsHTML =
                    "<p>No reviews yet.</p>";

            }


            // Display movie details
            container.innerHTML = `

                <div class="movie-card">

                    <img
                        class="movie-poster"
                        src="${posterMap[movie.title]}"
                        alt="${movie.title}"
                    >


                    <h2>
                        ${movie.title}
                    </h2>


                    <p>
                        <b>Year:</b>
                        ${movie.year || "N/A"}
                    </p>


                    <p>
                        <b>Genre:</b>
                        ${movie.genre || "N/A"}
                    </p>


                    <p>
                        <b>Rating:</b>
                        ⭐ ${movie.rating || "N/A"}/10
                    </p>


                    <p>
                        <b>Action:</b>
                        ⚔️ ${movie.actionRating || 0}/10
                    </p>


                    <p>
                        <b>Comedy:</b>
                        😂 ${movie.comedyRating || 0}/10
                    </p>


                    <p>
                        <b>Review:</b><br>
                        ${movie.review || "No review available."}
                    </p>


                    <hr>


                    <h2>
                        ⭐ User Reviews
                    </h2>


                    ${reviewsHTML}


                    <hr>


                    <h2>
                        📝 Add a Review
                    </h2>


                    <input
                        id="reviewName"
                        type="text"
                        placeholder="Your Name"
                    >


                    <br><br>


                    <input
                        id="reviewRating"
                        type="number"
                        min="1"
                        max="5"
                        placeholder="Rating (1-5)"
                    >


                    <br><br>


                    <textarea
                        id="reviewComment"
                        placeholder="Write your review..."
                    ></textarea>


                    <br><br>


                    <button
                        onclick="addReview('${movie._id}')"
                    >
                        Submit Review
                    </button>


                    <br><br>


                    <button
                        onclick="displayMovies(allMovies)"
                    >
                        ← Back to Movies
                    </button>

                </div>

            `;

        }


        // Add a new review
        async function addReview(movieId) {

            const name =
                document.getElementById("reviewName").value;

            const rating =
                document.getElementById("reviewRating").value;

            const comment =
                document.getElementById("reviewComment").value;


            if (!name || !rating || !comment) {

                alert("Please fill all fields.");

                return;

            }


            await fetch("/reviews", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    movieId: movieId,

                    name: name,

                    rating: rating,

                    comment: comment

                })

            });


            alert("Review added successfully!");


            const movie =
                allMovies.find(
                    m => m._id === movieId
                );


            showMovieDetails(movie);

        }


        // Edit an existing review
        async function editReview(reviewId, movieId) {

            const newName =
                prompt("Enter your name:");

            if (!newName) {
                return;
            }


            const newRating =
                prompt("Enter rating (1-5):");

            if (!newRating) {
                return;
            }


            const newComment =
                prompt("Enter your review:");

            if (!newComment) {
                return;
            }


            await fetch(`/reviews/${reviewId}`, {

                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    name: newName,

                    rating: newRating,

                    comment: newComment

                })

            });


            alert("Review updated successfully!");


            const movie =
                allMovies.find(
                    m => m._id === movieId
                );


            showMovieDetails(movie);

        }


        // Delete a review
        async function deleteReview(reviewId, movieId) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this review?"
                );


            if (!confirmDelete) {
                return;
            }


            await fetch(`/reviews/${reviewId}`, {

                method: "DELETE"

            });


            alert("Review deleted successfully!");


            const movie =
                allMovies.find(
                    m => m._id === movieId
                );


            showMovieDetails(movie);

        }


        // Search movies
        document
            .getElementById("search")
            .addEventListener("input", function () {

                const searchText =
                    this.value.toLowerCase();


                const filteredMovies =
                    allMovies.filter(movie =>

                        movie.title
                            .toLowerCase()
                            .includes(searchText)

                    );


                displayMovies(filteredMovies);

            });


        // Start application
        loadMovies();

    </script>

</body>

</html>
